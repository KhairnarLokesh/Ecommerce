<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="campaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51924" />
      <stop offset="100%" stop-color="#B70D16" />
    </linearGradient>
    <linearGradient id="campaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00529B" />
      <stop offset="100%" stop-color="#0083D6" />
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="2" y="2" width="196" height="56" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Campa Swoosh Arc -->
  <path d="M 28 44 Q 100 50 172 44 Q 100 46 28 44 Z" fill="url(#campaBlue)"/>
  <!-- Dynamic Beverage Bubble -->
  <circle cx="28" cy="22" r="6" fill="url(#campaRed)"/>
  <circle cx="22" cy="32" r="3.5" fill="url(#campaBlue)"/>
  <!-- Text CAMPA -->
  <text x="104" y="36" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#campaRed)" letter-spacing="2" text-anchor="middle" font-style="italic">
    CAMPA
  </text>
  <!-- Subtitle -->
  <text x="104" y="48" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="800" fill="#00529B" letter-spacing="3" text-anchor="middle">
    BEVERAGES
  </text>
</svg>
