<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="euroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="euroYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="2" y="2" width="196" height="56" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Snack Ripple Emblem -->
  <path d="M 20 30 Q 32 16 44 30 Q 32 44 20 30 Z" fill="url(#euroYellow)"/>
  <circle cx="32" cy="30" r="5" fill="url(#euroRed)"/>
  <!-- EURO text -->
  <text x="115" y="35" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#euroRed)" letter-spacing="1.5" text-anchor="middle" font-style="italic">
    EURO
  </text>
  <!-- Subtitle CHIPS -->
  <text x="115" y="47" font-family="'Montserrat', sans-serif" font-size="8" font-weight="800" fill="#D97706" letter-spacing="3" text-anchor="middle">
    CRISPY CHIPS
  </text>
</svg>
