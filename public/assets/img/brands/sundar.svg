<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="sundarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sundarRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="2" y="2" width="196" height="56" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Wheat / Crown decorative arc -->
  <path d="M 22 30 C 22 20, 32 16, 40 22 C 34 26, 30 32, 32 38 Z" fill="url(#sundarGold)"/>
  <!-- SUNDAR Oval Seal -->
  <rect x="24" y="14" width="24" height="24" rx="12" fill="url(#sundarRed)"/>
  <text x="36" y="31" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>
  <!-- Brand Title SUNDAR -->
  <text x="115" y="34" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="22" font-weight="800" fill="url(#sundarRed)" letter-spacing="2" text-anchor="middle">
    SUNDAR
  </text>
  <!-- Subtitle BISCUITS -->
  <text x="115" y="47" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="url(#sundarGold)" letter-spacing="4" text-anchor="middle">
    BISCUITS
  </text>
</svg>
